name: dsh-plugin

on:
  push:
    paths:
      - "dsh-hoploom/**"
      - "ssh-server-manager/**"
      - ".github/workflows/dsh-plugin.yml"
      - ".github/workflows/publish-dsh.yml"
  pull_request:
    paths:
      - "dsh-hoploom/**"
      - "ssh-server-manager/**"
      - ".github/workflows/dsh-plugin.yml"
      - ".github/workflows/publish-dsh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: dsh-hoploom/package-lock.json
      - run: python -m pip install build ./ssh-server-manager
      - run: npm ci --ignore-scripts --prefix ssh-server-manager/frontend
      - run: npm ci --ignore-scripts --prefix dsh-hoploom
      - run: npm run build:backend --prefix dsh-hoploom
        env:
          HOPLOOM_BUILD_PYTHON: python
      - run: npm run check --prefix dsh-hoploom
        env:
          HOPLOOM_TEST_PYTHON: python
          HOPLOOM_TEST_BOOTSTRAP: "1"
      - run: npm pack ./dsh-hoploom --pack-destination dsh-hoploom
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-hoploom-${{ matrix.os }}
          path: dsh-hoploom/*.tgz
