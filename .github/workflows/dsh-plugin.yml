name: dsh-plugin

on:
  workflow_call:
  push:
    paths:
      - "dsh-hoploom/**"
      - "ssh-server-manager/**"
      - ".github/workflows/dsh-plugin.yml"
      - ".github/workflows/publish-dsh.yml"
      - ".github/workflows/native-wheels.yml"
  pull_request:
    paths:
      - "dsh-hoploom/**"
      - "ssh-server-manager/**"
      - ".github/workflows/dsh-plugin.yml"
      - ".github/workflows/publish-dsh.yml"
      - ".github/workflows/native-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-plugin-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/native-wheels.yml

  verify:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: dsh-hoploom/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: native-dist
          path: native-dist
      - name: Install this commit's compatible wheel
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' ssh-server-manager/pyproject.toml | head -1)
          python -m pip install --only-binary=:all: --find-links native-dist "hoploom==$version"
      - run: npm ci --ignore-scripts --prefix ssh-server-manager/frontend
      - run: npm ci --ignore-scripts --prefix dsh-hoploom
      - run: npm run build:backend --prefix dsh-hoploom
        env:
          HOPLOOM_BUILD_PYTHON: python
          HOPLOOM_WHEEL_DIR: ${{ github.workspace }}/native-dist
      - run: npm run check --prefix dsh-hoploom
        env:
          HOPLOOM_TEST_PYTHON: python
          HOPLOOM_TEST_BOOTSTRAP: "1"
      - run: npm pack ./dsh-hoploom --pack-destination dsh-hoploom
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-hoploom-${{ matrix.os }}
          path: dsh-hoploom/*.tgz
