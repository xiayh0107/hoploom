name: publish-dsh

# Publishes through npm Trusted Publishing (OIDC): npmjs.com trusts this
# workflow file in the `npm` environment, which admits only dsh-hoploom-v*
# tags. No npm token is stored. Dispatch on dsh-hoploom-vX.Y.Z only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/dsh-hoploom-v')
    uses: ./.github/workflows/dsh-plugin.yml

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/dsh-hoploom-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - name: Require matching release tag
        working-directory: dsh-hoploom
        run: node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json")); if (process.env.GITHUB_REF_NAME !== "dsh-hoploom-v" + p.version) process.exit(1)'
      - uses: actions/download-artifact@v4
        with:
          name: dsh-hoploom-ubuntu-latest
          path: verified
      - name: Publish the already verified complete tarball
        run: npm publish verified/*.tgz --access public --provenance
