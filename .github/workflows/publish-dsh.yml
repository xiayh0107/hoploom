name: publish-dsh

# First publish locally, then configure the npm Trusted Publisher for this
# workflow and the npm environment. Dispatch on dsh-hoploom-vX.Y.Z only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/dsh-hoploom-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm install --global npm@11
      - name: Require matching release tag
        working-directory: dsh-hoploom
        run: node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json")); if (process.env.GITHUB_REF_NAME !== "dsh-hoploom-v" + p.version) process.exit(1)'
      - run: python -m pip install ./ssh-server-manager
      - run: npm ci --ignore-scripts --prefix dsh-hoploom
      - run: npm run check --prefix dsh-hoploom
        env:
          HOPLOOM_TEST_PYTHON: python
      - run: npm publish ./dsh-hoploom --access public --provenance
