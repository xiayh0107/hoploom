[package]
name = "hoploom-native"
version = "0.12.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
name = "_native"
path = "rust/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
pyo3 = { version = "=0.30.1", optional = true, features = ["extension-module", "abi3-py310"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
lto = "thin"
strip = "symbols"
